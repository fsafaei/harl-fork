name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          python-version: "3.11"
      # Build the wheel + sdist via the pyproject [build-system]
      # (hatchling). Catches packaging regressions before they reach
      # the release workflow.
      - run: uv build
      - run: uv pip install --system dist/*.whl
      # Smoke-test the installed wheel: the import path is `harl`
      # (distribution name is `harl-aht`, see README "About this
      # fork"). The two ego-AHT modules are the v0.1.0-aht delta
      # surface that downstream CONCERTO consumes.
      - run: |
          python -c "
          import harl
          import harl.algorithms.actors.happo
          import harl.algorithms.actors.ego_aht_happo
          import harl.runners.ego_aht_runner
          import harl.envs.concerto_env_adapter
          print('harl-aht import-smoke OK')
          "
