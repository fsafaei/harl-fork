[project]
name = "harl-aht"
version = "0.1.0"
description = "PyTorch implementation of HARL algorithms with the CONCERTO ego-AHT wrapper (HAPPO + Hydra runner + frozen-partner adapter)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "PKU-MARL HARL Contributors" },
  { name = "CONCERTO Contributors", email = "cooperative.physical.ai@gmail.com" },
]
keywords = [
  "heterogeneous-marl", "happo", "hatd3", "ad-hoc-teamwork",
  "multi-agent-reinforcement-learning", "pytorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime deps mirror upstream HARL setup.py (torch / pyyaml /
# tensorboard / tensorboardX / setproctitle), plus the additional
# dependency pulled in by the CONCERTO ego-AHT runner: hydra-core
# (`import hydra` at the top of harl/runners/ego_aht_runner.py).
# Upstream HARL uses its own argparse-based config plane and does
# not depend on Hydra, so this is a fork-only dependency.
dependencies = [
  "torch>=1.9.0",
  "pyyaml>=5.3.1",
  "tensorboard>=2.2.1",
  "tensorboardX",
  "setproctitle",
  "hydra-core>=1.3.2,<2.0",
]

[project.urls]
Homepage = "https://github.com/fsafaei/harl-fork"
Upstream = "https://github.com/PKU-MARL/HARL"
"Consumer (CONCERTO)" = "https://github.com/fsafaei/concerto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harl"]
# Env-specific binary asset trees inflate the wheel from ~5 MB to
# ~80 MB and are not required for the CONCERTO ego-AHT use case
# (which routes through harl/envs/concerto_env_adapter.py and the
# upstream ManiSkill stack). Consumers who need dexhands /
# mamujoco / lag envs install from source (`git clone` + the
# upstream HARL env-specific runtime deps, e.g. IsaacGym, JSBSim).
exclude = [
  "harl/envs/dexhands/DexterousHands/assets",
  "harl/envs/mamujoco/multiagent_mujoco/assets",
  "harl/envs/lag/JSBSim",
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
  "harl",
  "LICENSE",
  "NOTICE",
  "README.md",
  "pyproject.toml",
]
exclude = [
  "harl/envs/dexhands/DexterousHands/assets",
  "harl/envs/mamujoco/multiagent_mujoco/assets",
  "harl/envs/lag/JSBSim",
  "**/__pycache__",
  "**/*.pyc",
]
